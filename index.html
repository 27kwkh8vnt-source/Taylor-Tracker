<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Taylor Tracker">
<link rel="apple-touch-icon" href="TaylorGoodStanding.png">
<title>Taylor Tracker</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--text:#171717;--muted:#6d6d72;--line:#e6e1da;--green:#2f9b62;--red:#c84444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:560px;margin:auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}
h1{text-align:center;font-size:34px;line-height:1;margin:8px 0 6px;font-weight:900;letter-spacing:-1.2px}.sub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:14px 16px 18px;text-align:center;box-shadow:0 14px 36px rgba(30,25,20,.09)}
.character{height:280px;display:flex;align-items:flex-end;justify-content:center}.character img{max-height:270px;max-width:95%;object-fit:contain;transform-origin:center bottom}
.jump{animation:jump .72s cubic-bezier(.2,.8,.2,1)}.slump{animation:slump 1.15s ease}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-55px) scale(1.06)}60%{transform:translateY(4px) scale(.98)}100%{transform:translateY(0)}}
@keyframes slump{0%{transform:translateY(0) scale(1)}35%,80%{transform:translateY(24px) scale(.92)}100%{transform:translateY(0) scale(1)}}
.score{font-size:64px;font-weight:900;line-height:.95}.label{font-size:11px;font-weight:800;letter-spacing:1.1px;color:var(--muted);margin-top:7px}.status{font-size:20px;font-weight:850;margin-top:8px}.msg{font-size:13px;color:var(--muted);font-style:italic;margin:7px 0 12px}
.bar{height:10px;background:#ece8e1;border-radius:99px;overflow:hidden}.bar div{height:100%;background:var(--green);transition:width .3s}
.btn{width:100%;border:0;border-radius:16px;padding:16px 12px;color:#fff;font-weight:850;font-size:16px;margin-top:10px}.green{background:var(--green)}.red{background:var(--red)}
.section{font-size:14px;font-weight:900;margin:18px 3px 9px}.item{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px 14px;margin-bottom:8px}.item .t{flex:1}.name{font-size:14px;font-weight:700}.type{font-size:11px;color:var(--muted);margin-top:2px}.pts{font-size:18px;font-weight:900}.pos{color:var(--green)}.neg{color:var(--red)}.empty{text-align:center;color:var(--muted);font-size:13px;padding:18px}
.overlay{position:fixed;inset:0;background:#0006;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.show{display:flex}.sheet{width:min(100%,560px);max-height:84vh;background:#fbfaf8;border-radius:26px 26px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}.head{display:flex;gap:10px;padding:18px;border-bottom:1px solid var(--line)}.headtext{flex:1}.stitle{font-size:21px;font-weight:900}.ssub{font-size:12px;color:var(--muted);margin-top:4px}.close{border:0;border-radius:50%;width:32px;height:32px;font-size:18px}.list{overflow:auto;padding:8px 12px 16px}.option{width:100%;display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;margin:7px 0;text-align:left}.option span:first-child{flex:1;font-size:14px;font-weight:650}.custom{width:100%;border:1px dashed #aaa;background:#f3f0eb;border-radius:14px;padding:14px;font-weight:850;margin-top:8px}
.form{padding:14px 16px 20px}.form label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin:8px 2px 6px}.form input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;font-size:16px;background:#fff}.submit{width:100%;border:0;border-radius:15px;padding:15px;color:#fff;font-weight:900;margin-top:16px}
</style>
</head>
<body>
<main class="app">
<h1>TAYLOR TRACKER</h1><div class="sub">Official Boyfriend Performance Management System</div>
<section class="card">
<div class="character"><img id="taylor" src="TaylorGoodStanding.png" alt="Tiny Taylor"></div>
<div id="score" class="score">75</div><div class="label">BOYFRIEND RATING</div>
<div id="status" class="status"></div><div id="msg" class="msg"></div>
<div class="bar"><div id="fill"></div></div>
<button class="btn green" onclick="openPicker(true)">💚 COMMEND TAYLOR</button>
<button class="btn red" onclick="openPicker(false)">🚨 REPORT INCIDENT</button>
</section>
<div class="section">RECENT ACTIVITY</div><div id="activity"></div>
</main>
<div id="overlay" class="overlay" onclick="if(event.target===this)closeSheet()">
<div class="sheet"><div class="head"><div class="headtext"><div id="stitle" class="stitle"></div><div id="ssub" class="ssub"></div></div><button class="close" onclick="closeSheet()">×</button></div><div id="body" class="list"></div></div>
</div>
<script>
const pos=[
["Forehead Kiss",3],['Random "I Love You"',3],["Brings Katelin Coffee",4],["Brings You Flowers",5],["Brings Home a Treat",5],["Cooks Dinner",8],["Brings You a Snack",5],["Unprompted Compliment",4],["Unprompted Cuddle",3],["Does a Chore Without Being Asked",7],["Remembers Something Katelin Mentioned",6],["Thoughtful Surprise",8],["Plans a Date Without Assistance",10],["Unprompted Foot Rub",10],["Excellent Emotional Support",8],["Takes a Good Picture of Katelin",5],["Takes Multiple Good Pictures Without Complaining",8],["Handles an Annoying Errand",6],["Admits Katelin Was Right",10],["Apologizes Without Being Prompted",8],["Makes Katelin Laugh When Annoyed",6],["Exceptional Boyfriend Behavior",15]];
const neg=[
["Deez Nuts Joke",-3],['"That\'s What She Said" Joke',-3],["Cheating Joke",-5],["Katelin Says Something and Taylor Simply Does Not Respond",-2],["Was Clearly Not Listening",-5],["Phone Crimes During Quality Time",-4],["Excessive Phone Scrolling",-3],["Steals the Blanket",-4],["Falls Asleep During Movie Katelin Picked",-3],["Says It'll Be an Early Night, Stays Out Late",-8],["Fails to Provide ETA",-4],["Unnecessary Devil's Advocate Behavior",-5],["Weaponized Incompetence",-7],["Leaves Mess for Future Taylor",-4],["Repeated Deez Nuts Offense",-7],["Makes Same Joke After Being Told It Wasn't Funny",-6],["Fake Apology / Sorry You Feel That Way",-10],["Disturbing the Peace",-5],["General Boyfriend Misconduct",-5],["Boyfriend Felony",-25]];
let score=Number(localStorage.getItem("taylorScore")||75),activity=[];try{activity=JSON.parse(localStorage.getItem("taylorActivity")||"[]")}catch(e){}let customPositive=true;
function tier(){if(score>=90)return["👑 ELITE BOYFRIEND","Shareholders remain extremely pleased.","TaylorElite.png"];if(score>=75)return["💚 GOOD STANDING","No corrective action required.","TaylorGoodStanding.png"];if(score>=60)return["⚠️ UNDER REVIEW","Performance has declined this quarter.","TaylorUnderReview.png"];if(score>=40)return["📋 PROBATION","Management has identified several areas for improvement.","TaylorProbation.png"];return["🚔 BOYFRIEND JAIL","Privileges suspended pending forehead-kiss remediation.","TaylorJail.png"]}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function render(){const t=tier();scoreEl.textContent=score;status.textContent=t[0];msg.textContent=t[1];fill.style.width=score+"%";taylor.src=t[2];activityEl.innerHTML=activity.length?activity.slice(0,8).map(x=>`<div class="item"><div class="t"><div class="name">${esc(x.name)}</div><div class="type">${x.points>0?"Commendation":"Incident Report"}</div></div><div class="pts ${x.points>0?"pos":"neg"}">${x.points>0?"+":""}${x.points}</div></div>`).join(""):'<div class="empty">No entries yet. Taylor’s personnel file is currently clean.</div>'}
const scoreEl=document.getElementById("score"),status=document.getElementById("status"),msg=document.getElementById("msg"),fill=document.getElementById("fill"),taylor=document.getElementById("taylor"),activityEl=document.getElementById("activity"),overlay=document.getElementById("overlay"),body=document.getElementById("body"),stitle=document.getElementById("stitle"),ssub=document.getElementById("ssub");
function openPicker(isPos){customPositive=isPos;const data=isPos?pos:neg;stitle.textContent=isPos?"💚 Commend Taylor":"🚨 Report Incident";ssub.textContent=isPos?"Select qualifying boyfriend behavior.":"Select the applicable violation.";body.className="list";body.innerHTML=data.map(([n,p])=>`<button class="option" onclick='logAction(${JSON.stringify(n)},${p})'><span>${esc(n)}</span><b class="${p>0?"pos":"neg"}">${p>0?"+":""}${p}</b></button>`).join("")+`<button class="custom" onclick="openCustom(${isPos})">${isPos?"＋ Custom Commendation":"⚠️ Custom Incident"}</button>`;overlay.classList.add("show")}
function openCustom(isPos){customPositive=isPos;stitle.textContent=isPos?"Custom Commendation":"Custom Incident";ssub.textContent=isPos?"Document previously unclassified excellence.":"Document previously unclassified misconduct.";body.className="form";body.innerHTML=`<label>${isPos?"WHAT DID TAYLOR DO?":"DESCRIBE THE OFFENSE"}</label><input id="cname" type="text" placeholder="${isPos?"Commendable behavior":"Incident description"}"><label>POINTS</label><input id="cpoints" type="number" min="1" max="25" value="1"><button class="submit" style="background:${isPos?"var(--green)":"var(--red)"}" onclick="submitCustom()">${isPos?"💚 COMMEND TAYLOR":"🚨 FILE INCIDENT REPORT"}</button>`}
function submitCustom(){const n=document.getElementById("cname").value.trim();let p=Math.max(1,Math.min(25,Number(document.getElementById("cpoints").value||1)));if(n)logAction(n,customPositive?p:-p)}
function logAction(n,p){score=Math.max(0,Math.min(100,score+p));activity.unshift({name:n,points:p,time:Date.now()});activity=activity.slice(0,100);localStorage.setItem("taylorScore",score);localStorage.setItem("taylorActivity",JSON.stringify(activity));closeSheet();render();taylor.classList.remove("jump","slump");void taylor.offsetWidth;if(p>0){taylor.src=score>=90?"TaylorElite.png":"TaylorGoodStanding.png";taylor.classList.add("jump")}else{taylor.src=score<40?"TaylorJail.png":"TaylorProbation.png";taylor.classList.add("slump")}setTimeout(()=>{taylor.classList.remove("jump","slump");taylor.src=tier()[2]},p>0?760:1180)}
function closeSheet(){overlay.classList.remove("show")}
render();
</script>
</body>
</html>
