<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Taylor Tracker">

<title>Taylor Tracker</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f7f4ef;
    color: #171717;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
                 "Helvetica Neue", Arial, sans-serif;
    padding-bottom: 100px;
}

header {
    text-align: center;
    padding: 22px 16px 10px;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 6px 0 0;
    color: #777;
    font-size: 14px;
}

.page {
    display: none;
    padding: 0 16px 24px;
    max-width: 600px;
    margin: auto;
}

.page.active {
    display: block;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 20px;
    margin: 12px 0;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.center {
    text-align: center;
}

.character {
    width: 210px;
    height: 210px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
}

.score {
    font-size: 68px;
    font-weight: 800;
    line-height: 1;
    margin-top: 8px;
}

.label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .8px;
    margin-top: 10px;
}

.status {
    font-size: 20px;
    font-weight: 800;
    margin-top: 10px;
}

.message {
    color: #777;
    font-style: italic;
    font-size: 14px;
    margin-top: 8px;
}

.progress {
    width: 100%;
    height: 8px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
}

.progressFill {
    height: 100%;
    width: 75%;
    background: #2f9b62;
    border-radius: 10px;
    transition: width .25s ease;
}

button {
    border: none;
    border-radius: 15px;
    padding: 17px 15px;
    width: 100%;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
}

.green {
    background: #25c94a;
    color: white;
}

.red {
    background: #ff3934;
    color: white;
}

.blue {
    background: #4979bd;
    color: white;
}

.gray {
    background: #ececec;
    color: #222;
}

.buttonGap {
    height: 10px;
}

.sectionTitle {
    font-size: 20px;
    font-weight: 800;
    margin: 18px 2px 8px;
}

.activity {
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.activity:last-child {
    border-bottom: none;
}

.activityTop {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.activityName {
    font-weight: 700;
}

.pointsPositive {
    color: #168b49;
    font-weight: 800;
}

.pointsNegative {
    color: #d62e2e;
    font-weight: 800;
}

.activityDate {
    color: #888;
    font-size: 12px;
    margin-top: 4px;
}

.empty {
    color: #888;
    text-align: center;
    padding: 25px 10px;
}

.historyRow {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.historyRow:last-child {
    border-bottom: none;
}

.historyScore {
    font-size: 22px;
    font-weight: 800;
}

.small {
    color: #888;
    font-size: 13px;
}

/* MODAL */

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.42);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}

.overlay.show {
    display: flex;
}

.sheet {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 25px 25px 0 0;
    padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
    max-height: 80vh;
    overflow-y: auto;
}

.sheet h2 {
    margin: 0 0 14px;
}

.option {
    width: 100%;
    text-align: left;
    background: #f4f4f4;
    color: #171717;
    margin: 6px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.customRow {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.customRow input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
}

.customRow button {
    width: auto;
    padding-left: 18px;
    padding-right: 18px;
}

/* BOTTOM NAV */

nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(72px + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(255,255,255,.97);
    border-top: 1px solid #ddd;
    display: flex;
    z-index: 50;
}

.navButton {
    flex: 1;
    background: transparent;
    color: #777;
    border-radius: 0;
    padding: 10px 4px;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.navButton .icon {
    font-size: 22px;
    margin-bottom: 3px;
}

.navButton.active {
    color: #4979bd;
}
</style>
</head>

<body>

<header>
    <h1>Taylor Tracker</h1>
    <p>Official Boyfriend Accountability System</p>
</header>

<!-- TODAY -->

<section id="todayPage" class="page active">

    <div class="card center">

        <img
            id="taylorImage"
            class="character"
            src="TaylorGoodStanding.png"
            alt="Taylor"
        >

        <div id="score" class="score">75</div>
        <div class="label">BOYFRIEND RATING</div>

        <div id="status" class="status">
            👍 GOOD STANDING
        </div>

        <div id="message" class="message">
            Performance is currently acceptable.
        </div>

        <div class="progress">
            <div id="progressFill" class="progressFill"></div>
        </div>

    </div>

    <button id="commendButton" class="green">
        💚 COMMEND TAYLOR
    </button>

    <div class="buttonGap"></div>

    <button id="reportButton" class="red">
        🚨 REPORT INCIDENT
    </button>

    <div class="buttonGap"></div>

    <button id="newDayButton" class="blue">
        🌅 START NEW DAY
    </button>

    <div class="sectionTitle">Today's Activity</div>

    <div class="card">
        <div id="todayActivity"></div>
    </div>

</section>


<!-- HISTORY -->

<section id="historyPage" class="page">

    <div class="sectionTitle">Score History</div>

    <div class="card">
        <div id="historyList"></div>
    </div>

</section>


<!-- LOGS -->

<section id="logsPage" class="page">

    <div class="sectionTitle">All Behavior Logs</div>

    <div class="card">
        <div id="allLogs"></div>
    </div>

</section>


<!-- MODAL -->

<div id="overlay" class="overlay">

    <div class="sheet">

        <h2 id="sheetTitle">Choose Behavior</h2>

        <div id="options"></div>

        <div class="customRow">
            <input
                id="customText"
                type="text"
                placeholder="Custom behavior"
            >
            <button id="customAdd" class="blue">Add</button>
        </div>

        <div class="buttonGap"></div>

        <button id="cancelButton" class="gray">
            Cancel
        </button>

    </div>

</div>


<!-- NAVIGATION -->

<nav>

    <button class="navButton active" data-page="todayPage">
        <span class="icon">❤️</span>
        Today
    </button>

    <button class="navButton" data-page="historyPage">
        <span class="icon">📊</span>
        History
    </button>

    <button class="navButton" data-page="logsPage">
        <span class="icon">📋</span>
        Logs
    </button>

</nav>


<script>
(function () {

    "use strict";

    var START_SCORE = 75;

    var compliments = [
        ["Made Dinner", 5],
        ["Did the Dishes", 4],
        ["Cleaned Without Being Asked", 5],
        ["Bought Flowers", 6],
        ["Planned a Date", 7],
        ["Gave Foot Rub", 4],
        ["Good Communication", 5],
        ["Extra Affectionate", 4],
        ["Made Kate Laugh", 3],
        ["Thoughtful Surprise", 6]
    ];

    var incidents = [
        ["Didn't Listen", -4],
        ["Left a Mess", -3],
        ["Annoying for No Reason", -2],
        ["Bad Communication", -5],
        ["Forgot Something Important", -5],
        ["Was Grumpy", -3],
        ["Deez Nuts Joke", -3],
        ["That's What She Said Joke", -3],
        ["Cheating Joke", -5],
        ["General Boyfriend Misconduct", -4]
    ];


    function safeParse(value, fallback) {
        if (!value) return fallback;

        try {
            return JSON.parse(value);
        } catch (error) {
            return fallback;
        }
    }


    var savedScore = Number(localStorage.getItem("taylorScore"));

    var score = Number.isFinite(savedScore) && savedScore > 0
        ? savedScore
        : START_SCORE;

    var activity = safeParse(
        localStorage.getItem("taylorActivity"),
        []
    );

    var history = safeParse(
        localStorage.getItem("taylorHistory"),
        []
    );

    var dayStarted = localStorage.getItem("taylorDayStarted");

    if (!dayStarted) {
        dayStarted = new Date().toISOString();
        localStorage.setItem("taylorDayStarted", dayStarted);
    }


    var scoreEl = document.getElementById("score");
    var statusEl = document.getElementById("status");
    var messageEl = document.getElementById("message");
    var progressFill = document.getElementById("progressFill");
    var taylorImage = document.getElementById("taylorImage");

    var todayActivity = document.getElementById("todayActivity");
    var historyList = document.getElementById("historyList");
    var allLogs = document.getElementById("allLogs");

    var overlay = document.getElementById("overlay");
    var options = document.getElementById("options");
    var sheetTitle = document.getElementById("sheetTitle");
    var customText = document.getElementById("customText");

    var currentMode = "positive";


    function save() {
        localStorage.setItem("taylorScore", String(score));
        localStorage.setItem(
            "taylorActivity",
            JSON.stringify(activity)
        );
        localStorage.setItem(
            "taylorHistory",
            JSON.stringify(history)
        );
        localStorage.setItem(
            "taylorDayStarted",
            dayStarted
        );
    }


    function getTier(value) {

        if (value >= 90) {
            return {
                title: "👑 ELITE BOYFRIEND",
                message: "Shareholders remain extremely pleased.",
                image: "TaylorElite.png"
            };
        }

        if (value >= 75) {
            return {
                title: "👍 GOOD STANDING",
                message: "Performance is currently acceptable.",
                image: "TaylorGoodStanding.png"
            };
        }

        if (value >= 60) {
            return {
                title: "⚠️ UNDER REVIEW",
                message: "Management is monitoring the situation.",
                image: "TaylorUnderReview.png"
            };
        }

        if (value >= 40) {
            return {
                title: "🚨 PROBATION",
                message: "Immediate behavioral improvement required.",
                image: "TaylorProbation.png"
            };
        }

        return {
            title: "🚔 BOYFRIEND JAIL",
            message: "The board has reached its limit.",
            image: "TaylorJail.png"
        };
    }


    function formatDate(iso) {

        var date = new Date(iso);

        return date.toLocaleDateString(
            undefined,
            {
                month: "short",
                day: "numeric",
                year: "numeric"
            }
        );
    }


    function formatTime(iso) {

        var date = new Date(iso);

        return date.toLocaleTimeString(
            undefined,
            {
                hour: "numeric",
                minute: "2-digit"
            }
        );
    }


    function renderScore() {

        var tier = getTier(score);

        scoreEl.textContent = score;
        statusEl.textContent = tier.title;
        messageEl.textContent = tier.message;
        taylorImage.src = tier.image;

        var percent = Math.max(
            0,
            Math.min(100, score)
        );

        progressFill.style.width = percent + "%";
    }


    function activityHTML(item) {

        var pointsClass =
            item.points >= 0
                ? "pointsPositive"
                : "pointsNegative";

        var sign =
            item.points > 0
                ? "+"
                : "";

        return (
            '<div class="activity">' +
                '<div class="activityTop">' +
                    '<div class="activityName">' +
                        escapeHTML(item.name) +
                    '</div>' +
                    '<div class="' + pointsClass + '">' +
                        sign + item.points +
                    '</div>' +
                '</div>' +
                '<div class="activityDate">' +
                    formatDate(item.date) +
                    " • " +
                    formatTime(item.date) +
                '</div>' +
            '</div>'
        );
    }


    function escapeHTML(text) {

        var div = document.createElement("div");

        div.textContent = String(text);

        return div.innerHTML;
    }


    function renderToday() {

        if (!activity.length) {

            todayActivity.innerHTML =
                '<div class="empty">' +
                "No behavior logged yet today." +
                "</div>";

            return;
        }

        var html = "";

        for (var i = activity.length - 1; i >= 0; i--) {
            html += activityHTML(activity[i]);
        }

        todayActivity.innerHTML = html;
    }


    function renderHistory() {

        if (!history.length) {

            historyList.innerHTML =
                '<div class="empty">' +
                "No completed days yet." +
                "</div>";

            return;
        }

        var html = "";

        for (var i = history.length - 1; i >= 0; i--) {

            var day = history[i];
            var tier = getTier(day.score);

            html +=
                '<div class="historyRow">' +
                    "<div>" +
                        "<strong>" +
                            formatDate(day.date) +
                        "</strong>" +
                        '<div class="small">' +
                            escapeHTML(tier.title) +
                            " • " +
                            day.activities.length +
                            " logged behaviors" +
                        "</div>" +
                    "</div>" +
                    '<div class="historyScore">' +
                        day.score +
                    "</div>" +
                "</div>";
        }

        historyList.innerHTML = html;
    }


    function renderLogs() {

        var combined = [];

        for (var i = 0; i < history.length; i++) {

            var oldActivities = history[i].activities || [];

            for (var j = 0; j < oldActivities.length; j++) {
                combined.push(oldActivities[j]);
            }
        }

        for (var k = 0; k < activity.length; k++) {
            combined.push(activity[k]);
        }

        combined.sort(function (a, b) {
            return new Date(b.date) - new Date(a.date);
        });

        if (!combined.length) {

            allLogs.innerHTML =
                '<div class="empty">' +
                "No behavior has been logged yet." +
                "</div>";

            return;
        }

        var html = "";

        for (var x = 0; x < combined.length; x++) {
            html += activityHTML(combined[x]);
        }

        allLogs.innerHTML = html;
    }


    function renderEverything() {
        renderScore();
        renderToday();
        renderHistory();
        renderLogs();
    }


    function addBehavior(name, points) {

        score += points;

        if (score < 0) {
            score = 0;
        }

        if (score > 100) {
            score = 100;
        }

        activity.push({
            name: name,
            points: points,
            date: new Date().toISOString()
        });

        save();
        closeSheet();
        renderEverything();
    }


    function openSheet(mode) {

        currentMode = mode;

        var list =
            mode === "positive"
                ? compliments
                : incidents;

        sheetTitle.textContent =
            mode === "positive"
                ? "💚 Commend Taylor"
                : "🚨 Report Incident";

        options.innerHTML = "";

        for (var i = 0; i < list.length; i++) {

            (function (item) {

                var button = document.createElement("button");

                button.className = "option";

                var sign =
                    item[1] > 0
                        ? "+"
                        : "";

                button.innerHTML =
                    "<span>" +
                        escapeHTML(item[0]) +
                    "</span>" +
                    "<strong>" +
                        sign +
                        item[1] +
                    "</strong>";

                button.addEventListener(
                    "click",
                    function () {
                        addBehavior(
                            item[0],
                            item[1]
                        );
                    }
                );

                options.appendChild(button);

            })(list[i]);
        }

        customText.value = "";
        overlay.classList.add("show");
    }


    function closeSheet() {
        overlay.classList.remove("show");
    }


    function addCustomBehavior() {

        var name = customText.value.trim();

        if (!name) {
            return;
        }

        var points =
            currentMode === "positive"
                ? 3
                : -3;

        addBehavior(name, points);
    }


    function startNewDay() {

        var confirmed = window.confirm(
            "Start a new Taylor log? Today's score and activity will be saved to History."
        );

        if (!confirmed) {
            return;
        }

        history.push({
            date: dayStarted,
            score: score,
            activities: activity.slice()
        });

        score = START_SCORE;
        activity = [];
        dayStarted = new Date().toISOString();

        save();
        renderEverything();

        showPage("todayPage");
    }


    function showPage(pageID) {

        var pages =
            document.querySelectorAll(".page");

        for (var i = 0; i < pages.length; i++) {
            pages[i].classList.remove("active");
        }

        var selectedPage =
            document.getElementById(pageID);

        if (selectedPage) {
            selectedPage.classList.add("active");
        }


        var navButtons =
            document.querySelectorAll(".navButton");

        for (var j = 0; j < navButtons.length; j++) {

            navButtons[j].classList.remove("active");

            if (
                navButtons[j].getAttribute("data-page")
                === pageID
            ) {
                navButtons[j].classList.add("active");
            }
        }

        window.scrollTo(0, 0);

        renderEverything();
    }


    document
        .getElementById("commendButton")
        .addEventListener(
            "click",
            function () {
                openSheet("positive");
            }
        );


    document
        .getElementById("reportButton")
        .addEventListener(
            "click",
            function () {
                openSheet("negative");
            }
        );


    document
        .getElementById("newDayButton")
        .addEventListener(
            "click",
            startNewDay
        );


    document
        .getElementById("cancelButton")
        .addEventListener(
            "click",
            closeSheet
        );


    document
        .getElementById("customAdd")
        .addEventListener(
            "click",
            addCustomBehavior
        );


    overlay.addEventListener(
        "click",
        function (event) {

            if (event.target === overlay) {
                closeSheet();
            }
        }
    );


    var navButtons =
        document.querySelectorAll(".navButton");

    for (var i = 0; i < navButtons.length; i++) {

        navButtons[i].addEventListener(
            "click",
            function () {

                var page =
                    this.getAttribute("data-page");

                showPage(page);
            }
        );
    }


    renderEverything();

})();
</script>

</body>
</html>
