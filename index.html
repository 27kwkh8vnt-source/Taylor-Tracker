<meta name="theme-color" content="#f7f4ef">

<meta

    content="yes"

<meta
    name="apple-mobile-web-app-status-bar-style"

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f7f4ef;
    color: #171717;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;
    padding-bottom: 100px;
}

header {
    text-align: center;
    padding: 22px 16px 10px;
}

header h1 {
    margin: 0;
    font-size: 30px;
    font-weight: 900;
}

header p {
    margin: 6px 0 0;
    color: #777;
    font-size: 14px;
}

.page {
    display: none;
    padding: 0 16px 24px;
    max-width: 600px;
    margin: auto;
}

.page.active {
    display: block;
}

.card {
    background: white;
    border-radius: 22px;
    padding: 20px;
    margin: 12px 0;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.center {
    text-align: center;
}

.character {
    width: 220px;
    height: 220px;
    object-fit: contain;
    display: block;
    margin: 0 auto 8px;
    transform-origin: center bottom;
}

.jump {
    animation: jumpTaylor .7s ease;
}

.slump {
    animation: slumpTaylor 1s ease;
}

@keyframes jumpTaylor {
    0% {
        transform: translateY(0) scale(1);
    }

    40% {
        transform: translateY(-50px) scale(1.06);
    }

    70% {
        transform: translateY(4px) scale(.98);
    }

    100% {
        transform: translateY(0) scale(1);
    }
}

@keyframes slumpTaylor {
    0% {
        transform: translateY(0) scale(1);
    }

    40% {
        transform: translateY(22px) scale(.92);
    }

    80% {
        transform: translateY(22px) scale(.92);
    }

    100% {
        transform: translateY(0) scale(1);
    }
}

.score {
    font-size: 68px;
    font-weight: 900;
    line-height: 1;
    margin-top: 8px;
}

.label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .8px;
    margin-top: 10px;
}

.status {
    font-size: 20px;
    font-weight: 800;
    margin-top: 10px;
}

.message {
    color: #777;
    font-style: italic;
    font-size: 14px;
    margin-top: 8px;
}

.recordBanner {
    display: none;
    margin-top: 12px;
    background: #fff3c4;
    border: 1px solid #f0cf54;
    color: #6d5200;
    border-radius: 14px;
    padding: 11px 12px;
    font-size: 14px;
    font-weight: 900;
}

.recordBanner.show {
    display: block;
    animation: recordPop .5s ease;
}

@keyframes recordPop {
    0% {
        transform: scale(.85);
        opacity: 0;
    }

    70% {
        transform: scale(1.05);
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

.progress {
    width: 100%;
    height: 8px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
}

.progressFill {
    height: 100%;
    width: 75%;
    background: #2f9b62;
    border-radius: 10px;
    transition: width .25s ease;
}

button {
    border: none;
    border-radius: 15px;
    padding: 17px 15px;
    width: 100%;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
}

.green {
    background: #25c94a;
    color: white;
}

.red {
    background: #ff3934;
    color: white;
}

.blue {
    background: #4979bd;
    color: white;
}

.gray {
    background: #ececec;
    color: #222;
}

.buttonGap {
    height: 10px;
}

.sectionTitle {
    font-size: 20px;
    font-weight: 800;
    margin: 18px 2px 8px;
}

.activity {
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.activity:last-child {
    border-bottom: none;
}

.activityTop {

}

.activityName {
    font-weight: 700;
}

.pointsPositive {
    color: #168b49;
    font-weight: 800;
}

.pointsNegative {
    color: #d62e2e;
    font-weight: 800;
}

.activityDate {
    color: #888;
    font-size: 12px;
    margin-top: 4px;

.empty {
    color: #888;
    text-align: center;
    padding: 25px 10px;
}

.historyRow {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.historyRow:last-child {
    border-bottom: none;
}

.historyTop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}

.historyScore {
    font-size: 24px;
    font-weight: 900;
}

.small {
    color: #888;
    font-size: 13px;
    margin-top: 3px;
}

.historyDetails {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid #eee;
}

.historyBehavior {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 5px 0;
    font-size: 13px;
}

.statsGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.statCard {
    background: white;
    border-radius: 18px;
    padding: 16px;
    text-align: center;

.statNumber {
    font-size: 27px;

}

.statLabel {
    color: #777;
    font-size: 12px;
    margin-top: 4px;

.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.42);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
}

.overlay.show {
    display: flex;
}

.sheet {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: 25px 25px 0 0;
    padding:

    overflow-y: auto;
}

.sheet h2 {
    margin: 0 0 5px;
}

.sheetSubtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 14px;
}

.option {
    width: 100%;
    text-align: left;
    background: #f4f4f4;
    color: #171717;
    margin: 6px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;

.option strong {
    flex-shrink: 0;
}

.customSection {
    margin-top: 18px;
    border-top: 1px solid #eee;
    padding-top: 15px;
}

.customTitle {
    font-weight: 800;
    margin-bottom: 8px;

.customInput {

    padding: 14px;
    font-size: 16px;
    margin-bottom: 8px;

.pointsRow {

.pointsInput {

    border-radius: 12px;
    padding: 14px;
    font-size: 16px;

.customAddButton {

nav {

    bottom: 0;
    left: 0;
    right: 0;

    margin-bottom: 3px;

.navButton.active {
    color: #4979bd;

</head>

) {

    }

    try {

    }

/* DATE HELPERS */

function formatDate(
    iso
) {

    var date =
        new Date(iso);

    return date
        .toLocaleDateString(
            undefined,
            {
                month:
                    "short",

                day:
                    "numeric",

                year:
                    "numeric"
            }
        );
}


function formatTime(
    iso
) {

    var date =
        new Date(iso);

    return date
        .toLocaleTimeString(
            undefined,
            {
                hour:
                    "numeric",

                minute:
                    "2-digit"
            }
        );
}


/* ESCAPE */

function escapeHTML(
    text
) {

    var div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}

    statusEl.textContent =
        tier.title;


    messageEl.textContent =
        tier.message;


    taylorImage.src =
        tier.image;


    progressFill.style.width =
        Math.min(
            100,
            Math.max(
                0,
                score
            )

}

            : "";


    return (

        '<div class="activity">' +

            '<div class="activityTop">' +

                '<div class="activityName">' +

                    escapeHTML(
                        item.name
                    ) +

                "</div>" +


                '<div class="' +
                    pointsClass +
                '">' +

                    sign +
                    item.points +

                "</div>" +

            "</div>" +


            '<div class="activityDate">' +

                formatDate(
                    item.date
                ) +

                " • " +

                formatTime(
                    item.date
                ) +

            "</div>" +

        "</div>"
    );
}


/* TODAY */

function renderToday() {

    if (
        activity.length === 0
    ) {

        todayActivity.innerHTML =

            '<div class="empty">' +

            "No behavior logged yet today." +

            "</div>";

        return;
    }


    var html = "";


    for (
        var i =
            activity.length - 1;

        i >= 0;

        i--
    ) {

        html +=
            activityHTML(
                activity[i]
            );
    }


    todayActivity.innerHTML =
        html;
}


/* HISTORY */

function renderHistory() {

    if (
        history.length === 0
    ) {

        historyList.innerHTML =

            '<div class="empty">' +

            "No completed days yet." +

            "</div>";

    } else {

        var html = "";


        for (
            var i =
                history.length - 1;

            i >= 0;

            i--
        ) {

            var day =
                history[i];


            var tier =
                getTier(
                    day.score
                );


            html +=

                '<div class="historyRow">' +

                    '<div class="historyTop">' +

                        "<div>" +

                            "<strong>" +

                                formatDate(
                                    day.date
                                ) +

                            "</strong>" +


                            '<div class="small">' +

                                escapeHTML(
                                    tier.title
                                ) +

                                " • " +

                                day.activities.length +

                                " logged behaviors" +

                            "</div>" +

                        "</div>" +


                        '<div class="historyScore">' +

                            day.score +

                        "</div>" +

                    "</div>";


            if (
                day.activities.length
            ) {

                html +=
                    '<div class="historyDetails">';


                for (
                    var j = 0;

                    j <
                    day.activities.length;

                    j++
                ) {

                    var event =
                        day.activities[j];


                    html +=

                        '<div class="historyBehavior">' +

                            "<span>" +

                                escapeHTML(
                                    event.name
                                ) +

                            "</span>" +


                            '<strong class="' +

                                (
                                    event.points > 0
                                    ? "pointsPositive"
                                    : "pointsNegative"
                                ) +

                            '">' +

                                (
                                    event.points > 0
                                    ? "+"
                                    : ""
                                ) +

                                event.points +

                            "</strong>" +

                        "</div>";
                }


                html +=
                    "</div>";
            }


            html +=
                "</div>";
        }


        historyList.innerHTML =
            html;
    }


    renderStats();
}


/* STATS */

function renderStats() {

    var totalDays =
        history.length;


    var totalScore = 0;

    var worst = null;


    for (
        var i = 0;

        i < history.length;

        i++
    ) {

        totalScore +=
            history[i].score;


        if (
            worst === null ||
            history[i].score < worst
        ) {

            worst =
                history[i].score;
        }
    }


    var average =
        totalDays > 0
            ? Math.round(
                totalScore /
                totalDays
              )
            : "—";


    var worstDisplay =
        worst === null
            ? "—"
            : worst;


    statsGrid.innerHTML =

        '<div class="statCard">' +

            '<div class="statNumber">' +

                average +

            "</div>" +

            '<div class="statLabel">Average Rating</div>' +

        "</div>" +


        '<div class="statCard">' +

            '<div class="statNumber">' +

                bestScore +

            "</div>" +

            '<div class="statLabel">🏆 Best Score Ever</div>' +

        "</div>" +


        '<div class="statCard">' +

            '<div class="statNumber">' +

                totalDays +

            "</div>" +

            '<div class="statLabel">Archived Days</div>' +

        "</div>" +


        '<div class="statCard">' +

            '<div class="statNumber">' +

                worstDisplay +

            "</div>" +

            '<div class="statLabel">Worst Day</div>' +

        "</div>";
}


/* LOGS */

function renderLogs() {

    var combined = [];


    for (
        var i = 0;

        i < history.length;

        i++
    ) {

        var oldActivities =
            history[i].activities ||
            [];


        for (
            var j = 0;

            j <
            oldActivities.length;

            j++
        ) {

            combined.push(
                oldActivities[j]
            );
        }
    }


    for (
        var k = 0;

        k < activity.length;

        k++
    ) {

        combined.push(
            activity[k]
        );
    }


    combined.sort(
        function (
            a,
            b
        ) {

            return (
                new Date(
                    b.date
                ) -

                new Date(
                    a.date
                )
            );
        }
    );


    if (
        combined.length === 0
    ) {

        allLogs.innerHTML =

            '<div class="empty">' +

            "No behavior has been logged yet." +

            "</div>";

        return;
    }


    var html = "";


    for (
        var x = 0;

        x <
        combined.length;

        x++
    ) {

        html +=
            activityHTML(
                combined[x]
            );
    }


    allLogs.innerHTML =
        html;
}


/* RENDER ALL */

function renderEverything() {

    renderScore();

    renderToday();

    renderHistory();

    renderLogs();
}


/* RECORD */

function showRecordBanner() {

    recordBanner
        .classList
        .add(
            "show"
        );


    setTimeout(

        function () {

            recordBanner
                .classList
                .remove(
                    "show"
                );
        },

        2200
    );
}


/* ANIMATION */

function animateTaylor(
    points
) {

    taylorImage.classList.remove(
        "jump"
    );

    taylorImage.classList.remove(
        "slump"
    );


    void taylorImage.offsetWidth;


    if (
        points > 0
    ) {

        if (
            score >= 90
        ) {

            taylorImage.src =
                "TaylorElite.png";

        } else {

            taylorImage.src =
                "TaylorGoodStanding.png";
        }


        taylorImage.classList.add(
            "jump"
        );

    } else {

        if (
            score < 40
        ) {

            taylorImage.src =
                "TaylorJail.png";

        } else {

            taylorImage.src =
                "TaylorProbation.png";
        }


        taylorImage.classList.add(
            "slump"
        );
    }


    setTimeout(

        function () {

            taylorImage
                .classList
                .remove(
                    "jump"
                );


            taylorImage
                .classList
                .remove(
                    "slump"
                );


            taylorImage.src =
                getTier(
                    score
                ).image;
        },

        1100
    );
}


/* ADD BEHAVIOR */

function addBehavior(
    name,
    points
) {

    var oldBest =
        bestScore;


    score +=
        points;


    score =
        Math.max(
            0,
            score
        );


    if (
        score >
        bestScore
    ) {

        bestScore =
            score;
    }


    activity.push({

        name:
            name,

        points:
            points,

        date:
            new Date()
                .toISOString()
    });


    save();


    closeSheet();


    renderEverything();


    animateTaylor(
        points
    );


    if (
        score >
        oldBest
    ) {

        showRecordBanner();
    }
}


/* OPEN SHEET */

function openSheet(
    mode
) {

    currentMode =
        mode;


    var list =
        mode ===
        "positive"

        ? compliments

        : incidents;


    sheetTitle.textContent =

        mode ===
        "positive"

        ? "💚 Commend Taylor"

        : "🚨 Report Incident";


    sheetSubtitle.textContent =

        mode ===
        "positive"

        ? "Select qualifying boyfriend behavior."

        : "Select the applicable violation.";


    options.innerHTML =
        "";


    for (
        var i = 0;

        i <
        list.length;

        i++
    ) {

        addOptionButton(
            list[i]
        );
    }


    customText.value =
        "";

    customPoints.value =
        3;


    overlay
        .classList
        .add(
            "show"
        );
}


/* OPTION BUTTON */

function addOptionButton(
    item
) {

    var button =
        document.createElement(
            "button"
        );


    button.className =
        "option";


    var sign =
        item[1] > 0
            ? "+"
            : "";


    button.innerHTML =

        "<span>" +

            escapeHTML(
                item[0]
            ) +

        "</span>" +


        "<strong>" +

            sign +
            item[1] +

        "</strong>";


    button.addEventListener(

        "click",

        function () {

            addBehavior(
                item[0],
                item[1]
            );
        }
    );


    options.appendChild(
        button
    );
}


/* CUSTOM */

function addCustomBehavior() {

    var name =
        customText
            .value
            .trim();


    if (!name) {
        return;
    }


    var amount =
        Number(
            customPoints.value
        );


    if (
        !Number.isFinite(
            amount
        )
    ) {

        amount = 3;
    }


    amount =
        Math.max(
            1,
            Math.min(
                50,
                Math.abs(
                    amount
                )
            )
        );


    var points =
        currentMode ===
        "positive"

        ? amount

        : -amount;


    addBehavior(
        name,
        points
    );
}


/* CLOSE */

function closeSheet() {

    overlay
        .classList
        .remove(
            "show"
        );
}


/* NEW DAY */

function startNewDay() {

    var confirmed =
        window.confirm(

            "Archive today's performance and start a new Taylor log at 75?"
        );


    if (!confirmed) {

        return;
    }


    history.push({

        date:
            dayStarted,

        score:
            score,

        activities:
            activity.slice()
    });


    score =
        START_SCORE;


    activity =
        [];


    dayStarted =
        new Date()
            .toISOString();


    if (
        score >
        bestScore
    ) {

        bestScore =
            score;
    }


    save();


    renderEverything();


    showPage(
        "todayPage"
    );
}


/* NAV */

function showPage(
    pageID
) {

    var pages =
        document
            .querySelectorAll(
                ".page"
            );


    for (
        var i = 0;

        i <
        pages.length;

        i++
    ) {

        pages[i]
            .classList
            .remove(
                "active"
            );
    }


    var page =
        document.getElementById(
            pageID
        );


    if (page) {

        page
            .classList
            .add(
                "active"
            );
    }


    var navButtons =
        document
            .querySelectorAll(
                ".navButton"
            );


    for (
        var j = 0;

        j <
        navButtons.length;

        j++
    ) {

        navButtons[j]
            .classList
            .remove(
                "active"
            );


        if (

            navButtons[j]
                .getAttribute(
                    "data-page"
                )

            ===

            pageID

        ) {

            navButtons[j]
                .classList
                .add(
                    "active"
                );
        }
    }


    window.scrollTo(
        0,
        0
    );


    renderEverything();
}


/* LISTENERS */

document
    .getElementById(
        "commendButton"
    )
    .addEventListener(

        "click",

        function () {

            openSheet(
                "positive"
            );
        }
    );


document
    .getElementById(
        "reportButton"
    )
    .addEventListener(

        "click",

        function () {

            openSheet(
                "negative"
            );
        }
    );


document
    .getElementById(
        "newDayButton"
    )
    .addEventListener(

        "click",

        startNewDay
    );


document
    .getElementById(
        "cancelButton"
    )
    .addEventListener(

        "click",

        closeSheet
    );


document
    .getElementById(
        "customAdd"
    )
    .addEventListener(

        "click",

        addCustomBehavior
    );


overlay.addEventListener(

    "click",

    function (
        event
    ) {

        if (
            event.target ===
            overlay
        ) {

            closeSheet();
        }
    }
);


var navButtons =
    document
        .querySelectorAll(
            ".navButton"
        );


for (
    var n = 0;

    n <
    navButtons.length;

    n++
) {

    navButtons[n]
        .addEventListener(

            "click",

            function () {

                var page =
                    this.getAttribute(
                        "data-page"
                    );


                showPage(
                    page
                );
            }
        );
}


/* INITIAL BEST SCORE MIGRATION */

if (
    score >
    bestScore
) {

    bestScore =
        score;
}


for (
    var h = 0;

    h < history.length;

    h++
) {

    if (
        history[h].score >
        bestScore
    ) {

        bestScore =
            history[h].score;
    }
}


save();

renderEverything();


})();
</script>

</body>
</html>
