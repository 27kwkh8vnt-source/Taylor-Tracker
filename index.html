* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #f7f4ef;
    color: #171717;

header {

    padding: 22px 16px 10px;

header h1 {

header p {

.page {

    margin: auto;
}

.page.active {

}

.card {
    background: white;
    border-radius: 22px;
    padding: 20px;

    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.center {

}

.character {
    width: 220px;
    height: 220px;

    display: block;
    margin: 0 auto 8px;
}

.score {
    font-size: 68px;
    font-weight: 900;
    line-height: 1;
}

.label {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .8px;
    margin-top: 10px;
}

.status {
    font-size: 20px;
    font-weight: 900;
    margin-top: 10px;
}

.message {
    color: #777;
    font-size: 14px;
    font-style: italic;
    margin-top: 7px;
}

.banner {
    display: none;
    margin-top: 12px;
    border-radius: 14px;
    padding: 11px;
    font-size: 14px;
    font-weight: 900;
}

.banner.show {
    display: block;
}

#recordBanner {
    background: #fff3c4;
    border: 1px solid #f0cf54;
    color: #6d5200;
}

#newsBanner {
    background: #eaf2ff;
    border: 1px solid #9fb9e6;
    color: #254c7b;
}

#pipBanner {
    background: #fff0ed;
    border: 1px solid #f1a39a;
    color: #8c2b1f;
}

#streakBanner {
    background: #eaf8ef;
    border: 1px solid #9ed6b0;
    color: #24673d;
}

.progress {
    height: 8px;
    background: #eee;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
}

#progressFill {
    height: 100%;
    background: #2f9b62;
    border-radius: 10px;
    transition: width .25s;
}

button {
    border: none;
    border-radius: 15px;
    padding: 17px 15px;
    width: 100%;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    touch-action: manipulation;
}

.green {
    background: #25c94a;
    color: white;
}

.red {
    background: #ff3934;
    color: white;
}

.blue {
    background: #4979bd;
    color: white;
}

.gold {
    background: #d6aa23;
    color: white;
}

.gray {
    background: #ececec;
    color: #222;
}

.gap {
    height: 10px;
}

.sectionTitle {
    font-size: 20px;
    font-weight: 900;
    margin: 18px 2px 8px;
}

.activity {
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.activity:last-child {
    border-bottom: none;
}

.activityTop {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.activityName {
    font-weight: 700;
}

.positive {
    color: #168b49;
    font-weight: 900;
}

.negative {
    color: #d62e2e;
    font-weight: 900;
}

.small {

    font-size: 12px;
    margin-top: 4px;
}

.empty {
    text-align: center;
    color: #888;
    padding: 24px 8px;
}

.statsGrid,
.badgeGrid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.statCard,
.badge {
    background: white;
    border-radius: 18px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.05);

.statNumber {
    font-size: 26px;
    font-weight: 900;
}

.statLabel {
    color: #777;
    font-size: 12px;
    margin-top: 4px;
}

.badge.locked {

}

.badgeIcon {
    font-size: 28px;
}

.badgeName {

.badgeNote {

.historyRow {

.historyScore {

.reviewGrade {

.overlay {

    background: rgba(0,0,0,.42);

    justify-content: center;

nav {

.navButton span {

    font-size: 22px;

.navButton.active {

function readJSON(key,fallback) {
    try {
        var value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
    } catch(e) {
        return fallback;
    }
}

var savedScore = Number(localStorage.getItem("taylorScore"));

var score =
    Number.isFinite(savedScore)
    ? savedScore
    : START_SCORE;

var activity =
    readJSON("taylorActivity",[]);

var history =
    readJSON("taylorHistory",[]);

var bestScore =
    Number(localStorage.getItem("taylorBestScore"));

if (!Number.isFinite(bestScore)) {
    bestScore = score;
}

var dayStarted =
    localStorage.getItem("taylorDayStarted")
    || new Date().toISOString();

var currentMode = "positive";


function save() {

    localStorage.setItem(

function getTier(value) {

    if (value >= 90) {
        return {
            title:"👑 ELITE BOYFRIEND",
            message:"Shareholders remain extremely pleased.",
            image:"TaylorElite.png"
        };
    }

    if (value >= 75) {

            image:"TaylorGoodStanding.png"
        };
    }

    if (value >= 60) {
        return {
            title:"⚠️ UNDER REVIEW",
            message:"Performance has declined this quarter.",
            image:"TaylorUnderReview.png"
        };
    }

    if (value >= 40) {
        return {
            title:"📋 PROBATION",
            message:"Management has identified several areas for improvement.",
            image:"TaylorProbation.png"
        };
    }

    return {
        title:"🚔 BOYFRIEND JAIL",
        message:"Privileges suspended pending remediation.",
        image:"TaylorJail.png"
    };
}


function escapeHTML(text) {

    var div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;
}


function formatDate(date) {

    return new Date(date)
        .toLocaleDateString(
            undefined,
            {
                month:"short",
                day:"numeric",
                year:"numeric"
            }
        );
}


function formatTime(date) {

    return new Date(date)
        .toLocaleTimeString(
            undefined,
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );
}


function allEvents() {

    var events = [];

    history.forEach(function(day) {

        (day.activities || [])
            .forEach(function(event) {
                events.push(event);
            });
    });

    activity.forEach(function(event) {
        events.push(event);
    });

    return events;
}


function renderScore() {

function renderToday() {

    var box =

        );

    if (!activity.length) {

        box.innerHTML =
            '<div class="empty">' +
            'No behavior logged yet today.' +
            '</div>';

        return;
    }

    box.innerHTML =
        activity
        .slice()
        .reverse()
        .map(activityHTML)
        .join("");
}


function daysSinceIncident() {

    var events =
        allEvents()
        .filter(function(event) {
            return event.points < 0;
        });

    if (!events.length) {
        return null;
    }

    var latest =
        new Date(
            events[events.length - 1].date
        );

    var now =
        new Date();

    return Math.max(
        0,
        Math.floor(
            (now - latest) /
            86400000
        )
    );
}


function eliteStreak() {

    var streak = 0;

    for (
        var i = history.length - 1;
        i >= 0;
        i--
    ) {

        if (history[i].score >= 90) {
            streak++;
        } else {
            break;
        }
    }

    if (score >= 90) {
        streak++;
    }

    return streak;
}


function renderStreak() {

    var banner =
        document.getElementById(
            "streakBanner"
        );

    var days =
        daysSinceIncident();

    var elite =
        eliteStreak();

    var messages = [];

    if (days !== null) {

        messages.push(
            "🦺 " +
            days +
            " DAY" +
            (days === 1 ? "" : "S") +
            " SINCE LAST INCIDENT"
        );
    }

    if (elite >= 2) {

        messages.push(
            "🔥 " +
            elite +
            "-DAY ELITE BOYFRIEND STREAK"
        );
    }

    if (messages.length) {

        banner.textContent =
            messages.join(" • ");

        banner.classList.add("show");

    } else {

        banner.classList.remove("show");
    }
}


function biggestEvent(positive) {

    var events =
        allEvents()
        .filter(function(event) {
            return positive
                ? event.points > 0
                : event.points < 0;
        });

    if (!events.length) {
        return null;
    }

    events.sort(function(a,b) {

        return positive
            ? b.points - a.points
            : a.points - b.points;
    });

    return events[0];
}

            negativeCount++;

    var average = "—";
    var worst = "—";

            });

        average =
            Math.round(
                scores.reduce(function(a,b) {
                    return a+b;
                },0) /
                scores.length
            );

        worst =
            Math.min.apply(
                null,
                scores
            );
    }

    var ratio =
        negativeCount
        ? (positiveCount / negativeCount)
            .toFixed(1)
        : positiveCount
            ? "∞"
            : "—";

    var bonus =
        Math.max(
            0,
            score - 100
        );

    var bestCommend =
        biggestEvent(true);

    var worstIncident =
        biggestEvent(false);

    var cards = [
        ["🏆",bestScore,"Best Score Ever"],
        ["📊",average,"Average Rating"],
        ["📈",positiveCount,"Lifetime Commendations"],
        ["🚨",negativeCount,"Lifetime Incidents"],
        ["➕",totalPositive,"Points Earned"],
        ["➖",totalNegative,"Points Lost"],
        ["⚖️",ratio,"Commendation / Incident Ratio"],
        ["💰",bonus,"Current Performance Bonus"],
        ["🔥",eliteStreak(),"Elite Streak"],
        ["📅",history.length,"Archived Days"]
    ];

    document.getElementById("statsGrid")
    .innerHTML =
        cards.map(function(card) {

            return (
                '<div class="statCard">' +
                '<div class="statNumber">' +
                card[0] + " " + card[1] +
                '</div>' +
                '<div class="statLabel">' +
                card[2] +
                '</div>' +
                '</div>'
            );
        }).join("") +

        '<div class="statCard">' +
        '<div class="statNumber">💚</div>' +
        '<div class="statLabel">' +
        (
            bestCommend
            ? "Biggest Commendation: " +
              escapeHTML(bestCommend.name) +

        '</div></div>' +

        '<div class="statLabel">' +
        (

}

function comebackAchievement() {

    for (
        var i = 1;
        i < history.length;
        i++

        if (
            history[i-1].score < 60 &&
            history[i].score >= 90
        ) {
            return true;
        }
    }

    return false;
}


function renderPerformanceReview() {

    var box =
        document.getElementById(
            "performanceReview"
        );

    if (history.length < 7) {

        box.innerHTML =
            '<strong>Quarterly Review Pending</strong>' +
            '<div class="small">' +
            'Archive ' +
            (7-history.length) +
            ' more day(s) to unlock Taylor’s formal performance review.' +
            '</div>';

        return;
    }


    var total =
        history.reduce(
            function(sum,day) {
                return sum + day.score;
            },
            0
        );

    var average =
        Math.round(
            total /
            history.length
        );

    var grade;

    if (average >= 90) {
        grade =
            "Exceeds Expectations";
    } else if (average >= 75) {
        grade =
            "Meets Expectations";
    } else if (average >= 60) {
        grade =
            "Needs Improvement";
    } else {
        grade =
            "Termination Recommended";
    }


    var positives = {};
    var negatives = {};

    allEvents()
    .forEach(function(event) {

        var target =
            event.points > 0
            ? positives
            : negatives;

        target[event.name] =
            (target[event.name] || 0) + 1;
    });


    function topThree(object) {

        return Object.keys(object)
            .sort(function(a,b) {
                return object[b] -
                       object[a];
            })
            .slice(0,3);
    }


    var strengths =
        topThree(positives);

    var growth =
        topThree(negatives);


    box.innerHTML =

        '<strong>Formal Boyfriend Performance Review</strong>' +

        '<div class="reviewGrade">' +
        grade +
        '</div>' +

        '<strong>Demonstrated Strengths</strong><br>' +

        (
            strengths.length
            ? strengths.map(function(x) {
                return '<span class="pill">' +
                       escapeHTML(x) +
                       '</span>';
              }).join("")
            : "Insufficient data."
        ) +

        '<div style="margin-top:12px">' +
        '<strong>Opportunities for Growth</strong><br>' +

        (
            growth.length
            ? growth.map(function(x) {
                return '<span class="pill">' +
                       escapeHTML(x) +
                       '</span>';
              }).join("")
            : "No material deficiencies identified."
        ) +

        '</div>';
}

function showTemporary(
    element,
    text
) {

    element.textContent = text;
    element.classList.add("show");

    setTimeout(function() {
        element.classList.remove("show");
    },2500);
}


function repeatPenalty(
    name,
    points
) {

    if (points >= 0) {
        return points;
    }

    var previous =
        allEvents()
        .filter(function(event) {
            return event.name === name;
        }).length;

    if (previous === 0) {
        return points;
    }

    if (previous === 1) {
        return Math.round(
            points * 1.5
        );
    }

    if (previous === 2) {
        return points * 2;
    }

    return Math.round(
        points * 2.5
    );
}


function trainingMessage(name) {

    if (
        name.indexOf("Listen") >= 0 ||
        name.indexOf("Hearing") >= 0 ||
        name.indexOf("respond") >= 0
    ) {
        return "🎓 Mandatory Listening Training assigned.";
    }

    if (
        name.indexOf("Picture") >= 0 ||
        name.indexOf("Photo") >= 0
    ) {
        return "📸 Remedial Girlfriend Photography Seminar assigned.";
    }

    if (
        name.indexOf("Phone") >= 0 ||
        name.indexOf("Text") >= 0
    ) {
        return "📱 Digital Presence & Responsiveness Training assigned.";
    }

    if (
        name.indexOf("Deez Nuts") >= 0 ||
        name.indexOf("That's What She Said") >= 0
    ) {
        return "🎤 Mandatory Joke Quality Control Workshop assigned.";
    }

    return null;
}


function addBehavior(
    name,
    points
) {

    var oldBest =
        bestScore;

    var adjusted =
        repeatPenalty(
            name,
            points
        );

    score =
        Math.max(
            0,
            score + adjusted
        );

    if (score > bestScore) {
        bestScore = score;
    }

    activity.push({
        name:name,
        points:adjusted,
        date:new Date().toISOString()
    });

    save();
    closeSheet();
    renderEverything();


    if (score > oldBest) {

        showTemporary(
            document.getElementById(
                "recordBanner"
            ),
            "🏆 NEW ALL-TIME RECORD: " +
            score
        );
    }


    if (
        adjusted < points &&
        points < 0
    ) {

        showTemporary(
            document.getElementById(
                "newsBanner"
            ),
            "🚨 REPEAT OFFENDER ENHANCEMENT: penalty increased from " +
            points +
            " to " +
            adjusted +
            "."
        );
    }


    var training =
        trainingMessage(name);

    if (training) {

        setTimeout(function() {

            showTemporary(
                document.getElementById(
                    "newsBanner"
                ),
                training
            );

        },2600);
    }
}


function openSheet(mode) {

    currentMode = mode;

    var list =
        mode === "positive"
        ? compliments
        : incidents;

    document.getElementById(
        "sheetTitle"
    ).textContent =
        mode === "positive"
        ? "💚 Commend Taylor"
        : "🚨 Report Incident";

    document.getElementById(
        "sheetSubtitle"
    ).textContent =
        mode === "positive"
        ? "Select qualifying boyfriend behavior."
        : "Select the applicable violation. Repeat offenses may receive enhanced penalties.";

    var options =
        document.getElementById(
            "options"
        );

    options.innerHTML = "";

    list.forEach(function(item) {

        var button =
            document.createElement(
                "button"
            );

        button.className =
            "option";

        button.innerHTML =
            "<span>" +
            escapeHTML(item[0]) +
            "</span>" +

            "<strong>" +
            (item[1] > 0 ? "+" : "") +
            item[1] +
            "</strong>";

        button.onclick =
            function() {

                addBehavior(
                    item[0],
                    item[1]
                );
            };

        options.appendChild(
            button
        );
    });

    document.getElementById(
        "overlay"
    ).classList.add("show");
}


function closeSheet() {

    document.getElementById(
        "overlay"
    ).classList.remove("show");
}


function addCustomBehavior() {

    var name =
        document.getElementById(
            "customText"
        ).value.trim();

    if (!name) {
        return;
    }

    var amount =
        Number(
            document.getElementById(
                "customPoints"
            ).value
        );

    if (!Number.isFinite(amount)) {
        amount = 3;
    }

    amount =
        Math.max(
            1,
            Math.min(
                50,
                Math.abs(amount)
            )
        );

    addBehavior(
        name,
        currentMode === "positive"
        ? amount
        : -amount
    );
}


function startNewDay() {

    if (
        !confirm(
            "Archive today's performance and start a new Taylor log at 75?"
        )
    ) {
        return;
    }

    history.push({
        date:dayStarted,
        score:score,
        activities:activity.slice()
    });

    score = START_SCORE;
    activity = [];
    dayStarted =
        new Date().toISOString();

    save();
    renderEverything();

    showPage(
        "todayPage",
        "todayTab"
    );
}


function showPage(
    pageID,
    tabID
) {

    var pages =
        document.querySelectorAll(
            ".page"
        );

    for (
        var i = 0;
        i < pages.length;
        i++
    ) {

        pages[i]
        .classList
        .remove("active");
    }


    var tabs =
        document.querySelectorAll(
            ".navButton"
        );

    for (
        var j = 0;
        j < tabs.length;
        j++
    ) {

        tabs[j]
        .classList
        .remove("active");
    }


    document.getElementById(
        pageID
    ).classList.add("active");


    document.getElementById(
        tabID
    ).classList.add("active");


    window.scrollTo(
        0,
        0
    );


    renderEverything();
}


function appealLastIncident() {

    for (
        var i = activity.length - 1;
        i >= 0;
        i--
    ) {

        if (
            activity[i].points < 0 &&
            !activity[i].appealed
        ) {

            if (
                !confirm(
                    'Appeal "' +
                    activity[i].name +
                    '"?\n\nKatelin is the final appellate authority.'
                )
            ) {
                return;
            }

            var refund =
                Math.ceil(
                    Math.abs(
                        activity[i].points
                    ) / 2
                );

            activity[i].appealed =
                true;

            activity.push({
                name:
                    "Appeal partially granted: " +
                    activity[i].name,

                points:refund,

                date:
                    new Date()
                    .toISOString()
            });

            score += refund;

            if (score > bestScore) {
                bestScore = score;
            }

            save();
            renderEverything();

            alert(
                "⚖️ APPEAL PARTIALLY GRANTED\n\n" +
                refund +
                " points restored by order of the appellate authority."
            );

            return;
        }
    }

    alert(
        "No appealable incident exists in today's active log."
    );
}

function conductAudit() {

    var audit =
        audits[
            Math.floor(
                Math.random() *
                audits.length
            )

    var answer =
        confirm(
            "🎲 RANDOM BOYFRIEND AUDIT\n\n" +
            audit.question +
            "\n\nTap OK for YES.\nTap Cancel for NO."

    var result =
        answer
        ? audit.yes

    addBehavior(

    );
}
